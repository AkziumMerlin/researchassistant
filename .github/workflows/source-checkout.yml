name: Source checkout

on:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/theia-remote-ssh
      - name: Capture branch tree
        run: git rev-parse 'HEAD^{tree}' > /tmp/tree-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: branch-tree
          path: /tmp/tree-sha.txt
          retention-days: 1
