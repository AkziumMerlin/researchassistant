name: Source checkout

on:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/researchassistant-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: researchassistant-source
          path: /tmp/researchassistant-source.tar.gz
          retention-days: 1
