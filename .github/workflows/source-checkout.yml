name: Apply remote desktop implementation

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/theia-remote-ssh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/theia-remote-ssh
          fetch-depth: 0
      - name: Detect pending transport
        id: transport
        run: |
          if [ -f .ra-transport/remote-ssh-00a.b64 ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.transport.outputs.present == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.transport.outputs.present == 'true'
        with:
          node-version: '24'
      - name: Install native prerequisites
        if: steps.transport.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbfile-dev tmux
      - name: Reconstruct verified source archive
        if: steps.transport.outputs.present == 'true'
        run: |
          echo '846e069e2a928a1e62286d6de7698a296196a944664dd01cf1d8efd56c55557c  .ra-transport/remote-ssh-00a.b64' | sha256sum --check
          echo '854a7cfe31b820871bcb08271673b6f67676c39c918cbddbc6d98e28afefd052  .ra-transport/remote-ssh-00b.b64' | sha256sum --check
          echo 'd4bb76ddb78f32ec2c681c8fc229ccba75a93e8cdbe895f817807969006c317b  .ra-transport/remote-ssh-01.b64' | sha256sum --check
          echo '6989389d6d4a660930f78996751153850a1c6d0e3691ca9f292ff6c05e8bf58b  .ra-transport/remote-ssh-02.b64' | sha256sum --check
          echo 'f48aa90cdf724c0d89b3312be54fe13545076efb6dc071fe236f5a0a3656831d  .ra-transport/remote-ssh-03.b64' | sha256sum --check
          echo 'f65f08e72c0a04581e240fc5c31aadd29b88fba90089c477539ac846042c8021  .ra-transport/remote-ssh-04.b64' | sha256sum --check
          cat \
            .ra-transport/remote-ssh-00a.b64 \
            .ra-transport/remote-ssh-00b.b64 \
            .ra-transport/remote-ssh-01.b64 \
            .ra-transport/remote-ssh-02.b64 \
            .ra-transport/remote-ssh-03.b64 \
            .ra-transport/remote-ssh-04.b64 \
            > /tmp/remote-ssh-change.b64
          echo 'c4303645dbba021baa59c436cc05fd2c22c2d8948a145495fa0c00f3aaa0e716  /tmp/remote-ssh-change.b64' | sha256sum --check
          base64 --decode /tmp/remote-ssh-change.b64 > /tmp/remote-ssh-change.tar.gz
          echo 'ae2fee09d026a3409dd60ccb4d0e423105c3ea529f1ab7e5e5565188ee0d568f  /tmp/remote-ssh-change.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/remote-ssh-change.tar.gz
          rm -rf .ra-transport
      - name: Validate Python implementation
        if: steps.transport.outputs.present == 'true'
        run: |
          python -m pip install -e '.[dev,desktop]'
          ruff check .
          pytest tests/test_remote_connect.py tests/test_desktop.py tests/test_theia_desktop_frontend.py
      - name: Validate Theia implementation
        if: steps.transport.outputs.present == 'true'
        run: |
          npm install --prefix desktop
          npm run build --prefix desktop
      - name: Commit functional sources
        if: steps.transport.outputs.present == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add SSH remote workspaces to Theia desktop'
          git push origin HEAD:feature/theia-remote-ssh
