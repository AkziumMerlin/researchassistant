name: Apply final source fixes

on:
  push:
    branches: [feature/research-workspace-v2]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-source-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/research-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Fix missing import and modal test ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          notebook = Path("src/research_assistant/notebook_ui.py")
          source = notebook.read_text(encoding="utf-8")
          anchor = "        from fastapi import Query, WebSocket, WebSocketDisconnect\n"
          response_import = "        from fastapi.responses import Response\n"
          if response_import not in source:
              if anchor not in source:
                  raise SystemExit("notebook import anchor not found")
              source = source.replace(anchor, anchor + response_import, 1)
          notebook.write_text(source, encoding="utf-8")

          test = Path("tests/test_research_workspace.py")
          source = test.read_text(encoding="utf-8")
          old = '''            page.goto(f"http://127.0.0.1:{port}", wait_until="networkidle")
            page.locator("#ra-research-workspace-button").click()
            workspace_dialog = page.locator("#ra-research-workspace[open]")
            workspace_dialog.wait_for()
            workspace_dialog.get_by_role(
                "heading",
                name="Research workspace",
            ).wait_for()
            workspace_dialog.locator(
                ".rwRunIdentity strong",
                has_text="study-a / run-a",
            ).first.wait_for()
            page.get_by_role("button", name="Layout", exact=True).wait_for()
'''
          new = '''            page.goto(f"http://127.0.0.1:{port}", wait_until="networkidle")
            page.get_by_role("button", name="Layout", exact=True).wait_for()
            page.locator("#ra-research-workspace-button").click()
            workspace_dialog = page.locator("#ra-research-workspace[open]")
            workspace_dialog.wait_for()
            workspace_dialog.get_by_role(
                "heading",
                name="Research workspace",
            ).wait_for()
            workspace_dialog.locator(
                ".rwRunIdentity strong",
                has_text="study-a / run-a",
            ).first.wait_for()
'''
          if old not in source:
              raise SystemExit("browser ordering block not found")
          test.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply targeted Ruff fixes
        run: |
          ruff check --fix \
            src/research_assistant/explorer_ui.py \
            src/research_assistant/notebook_ui.py \
            src/research_assistant/pipeline_ui.py \
            src/research_assistant/research_ui.py \
            src/research_assistant/system_monitor_ui.py \
            src/research_assistant/terminal_ui.py \
            src/research_assistant/ui/server.py \
            src/research_assistant/workbench_ui.py \
            src/research_assistant/workspace_browser_ui.py \
            tests/test_research_workspace.py
          ruff check .
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/research_assistant/explorer_ui.py \
            src/research_assistant/notebook_ui.py \
            src/research_assistant/pipeline_ui.py \
            src/research_assistant/research_ui.py \
            src/research_assistant/system_monitor_ui.py \
            src/research_assistant/terminal_ui.py \
            src/research_assistant/ui/server.py \
            src/research_assistant/workbench_ui.py \
            src/research_assistant/workspace_browser_ui.py \
            tests/test_research_workspace.py
          git commit -m "Fix bundled route imports and browser flow"
          git push origin HEAD:feature/research-workspace-v2
