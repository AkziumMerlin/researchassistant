name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,ui]'
      - run: ruff check .
      - run: pytest

  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/test_torch_integration.py

  frontend-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --prefix ui/frontend
      - run: npm run build --prefix ui/frontend
      - name: Verify generated UI assets are committed
        run: |
          git status --short --untracked-files=all -- src/research_assistant/ui/static
          test -z "$(git status --porcelain --untracked-files=all -- src/research_assistant/ui/static)"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          required = {
              "research_assistant/ui/static/index.html",
              "research_assistant/ui/static/jobs-extension.js",
              "research_assistant/ui/static/pipeline-extension.js",
              "research_assistant/ui/static/research-extension.js",
              "research_assistant/ui/static/architecture-extension.js",
              "research_assistant/ui/static/workbench-extension.js",
              "research_assistant/workbench_ui.py",
              "research_assistant/scientific_artifacts.py",
              "research_assistant/lifecycle.py",
              "research_assistant/analysis_sessions.py",
              "research_assistant/developer_tools.py",
              "research_assistant/workspaces.py",
              "research_assistant/analytics.py",
              "research_assistant/jobs.py",
              "research_assistant/integrations/parameterized_torch_graph.py",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing required files: {missing}")
          PY
      - name: Install wheel and smoke-test CLI
        run: |
          python -m venv /tmp/ra-wheel-smoke
          /tmp/ra-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ra-wheel-smoke/bin/ra --help

  apply-ui-fix:
    if: github.head_ref == 'fix/ui-toolbar-editor-layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-toolbar-editor-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply staged patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-ui-layout-fix.yml").read_text(encoding="utf-8")
          raw = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          source = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
          exec(compile(source, "apply-ui-layout-fix", "exec"))
          PY
      - name: Build and validate
        run: |
          npm ci --prefix ui/frontend
          npm run build --prefix ui/frontend
          cat src/research_assistant/ui/static/architecture-v2/part-*.txt > /tmp/architecture-v2.js
          node --check /tmp/architecture-v2.js
          python -m pip install -e '.[dev,ui]'
          ruff check .
          pytest tests/test_ui_layout_regression.py
          git diff --check
      - name: Commit clean fix
        run: |
          rm .github/workflows/apply-ui-layout-fix.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "researchassistant-ci"
          git config user.email "researchassistant-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore UI toolbar and editor layout"
          git push origin HEAD:fix/ui-toolbar-editor-layout
