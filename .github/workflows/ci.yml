name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-pending:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish connector-readable pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": "pending",
              "context": "ci/researchassistant",
              "description": "Ruff, tests, browser, Torch, frontend and wheel are running",
              "target_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }))
          PY
          )"
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,ui]'
      - run: ruff check .
      - run: pytest

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,ui,e2e]'
      - run: python -m playwright install --with-deps chromium
      - name: Run browser workbench flow
        env:
          RA_BROWSER_E2E: "1"
        run: pytest tests/test_research_workspace.py::test_research_workspace_browser_flow

  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/test_torch_integration.py

  frontend-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --prefix ui/frontend
      - run: npm run build --prefix ui/frontend
      - name: Check frontend module syntax
        run: |
          for path in ui/frontend/src/main.js ui/frontend/src/terminal-runtime.js ui/frontend/src/extensions/*.js; do
            node --check "$path"
          done
      - name: Verify generated UI assets are committed
        run: |
          git status --short --untracked-files=all -- src/research_assistant/ui/static
          test -z "$(git status --porcelain --untracked-files=all -- src/research_assistant/ui/static)"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          required = {
              "research_assistant/ui/static/index.html",
              "research_assistant/workbench_ui.py",
              "research_assistant/research_workspace_ui.py",
              "research_assistant/capabilities.py",
              "research_assistant/migrations.py",
              "research_assistant/plugin_sdk.py",
              "research_assistant/run_workspace.py",
              "research_assistant/notebook_context.py",
              "research_assistant/assistant_core.py",
              "research_assistant/durable_launches.py",
              "research_assistant/cli_research_workspace.py",
              "research_assistant/ui/adoption_worker.py",
              "research_assistant/terminal.py",
              "research_assistant/tmux_terminal.py",
              "research_assistant/terminal_ui.py",
              "research_assistant/system_monitor.py",
              "research_assistant/system_monitor_ui.py",
              "research_assistant/workspace_browser_ui.py",
              "research_assistant/notebooks.py",
              "research_assistant/notebook_ui.py",
              "research_assistant/scientific_artifacts.py",
              "research_assistant/lifecycle.py",
              "research_assistant/analysis_sessions.py",
              "research_assistant/developer_tools.py",
              "research_assistant/workspaces.py",
              "research_assistant/analytics.py",
              "research_assistant/jobs.py",
              "research_assistant/integrations/parameterized_torch_graph.py",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              index = archive.read("research_assistant/ui/static/index.html").decode()
              javascript = "\n".join(
                  archive.read(name).decode(errors="replace")
                  for name in names
                  if name.startswith("research_assistant/ui/static/assets/")
                  and name.endswith(".js")
              )
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing required files: {missing}")
          if "/api/extensions/" in index:
              raise SystemExit("built frontend still references runtime extension endpoints")
          for marker in (
              "Cross-run aggregation",
              "researchAssistantArchitectureWorkbenchV2",
              "raComponentSearchPalette",
          ):
              if marker not in javascript:
                  raise SystemExit(f"bundled frontend is missing marker: {marker}")
          PY
      - name: Install wheel and verify reported version
        run: |
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv /tmp/ra-wheel-smoke
          /tmp/ra-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ra-wheel-smoke/bin/ra --help
          test "$(/tmp/ra-wheel-smoke/bin/ra version)" = "$expected_version"
          test "$(/tmp/ra-wheel-smoke/bin/python -c 'import research_assistant; print(research_assistant.__version__)')" = "$expected_version"

  ci-status:
    if: always()
    needs: [test, browser-e2e, torch, frontend-package]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish connector-readable CI status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          TORCH_RESULT: ${{ needs.torch.result }}
          FRONTEND_RESULT: ${{ needs.frontend-package.result }}
        run: |
          state=success
          for result in "$TEST_RESULT" "$BROWSER_RESULT" "$TORCH_RESULT" "$FRONTEND_RESULT"; do
            if [ "$result" != success ]; then
              state=failure
            fi
          done
          export STATE="$state"
          payload="$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "ci/researchassistant",
              "description": "Ruff, tests, browser, Torch, frontend and wheel",
              "target_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }))
          PY
          )"
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
          test "$state" = success
