name: Apply frontend refactor

on:
  push:
    branches: [feature/research-workspace-v2]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-frontend-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/research-workspace-v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import refactor tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACK_PART_0: adac1fdb2d3e5f0fb5698a981bd71040abb8e7d5
          PACK_PART_1: 8dc4f85add0054220397df17843cb73f97fa104d
          REFACTOR_TREE: d75cd487b64aacea8263f56c6d98998a8a862df3
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          chunks = []
          for name in ("PACK_PART_0", "PACK_PART_1"):
              sha = os.environ[name]
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              chunk = base64.b64decode(payload["content"]).decode("utf-8")
              print(name, len(chunk), hashlib.sha256(chunk.encode()).hexdigest())
              chunks.append(chunk)
          encoded = "".join(chunks)
          print("JOINED", len(encoded), hashlib.sha256(encoded.encode()).hexdigest())
          with open("/tmp/refactor.pack", "wb") as stream:
              stream.write(base64.b64decode(encoded))
          PY
          git index-pack --stdin --fix-thin < /tmp/refactor.pack
          git read-tree --reset -u "$REFACTOR_TREE"
      - name: Build bundled frontend
        run: |
          npm ci --prefix ui/frontend
          npm run build --prefix ui/frontend
          python -m compileall -q src tests
          find ui/frontend/src/extensions -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check ui/frontend/src/main.js
          node --check ui/frontend/src/terminal-runtime.js
      - name: Commit and push refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor UI extensions into the frontend bundle"
          git push origin HEAD:feature/research-workspace-v2
