name: Apply final source fixes

on:
  push:
    branches: [feature/research-workspace-v2]

permissions:
  contents: write

concurrency:
  group: final-source-fixes
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/research-workspace-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Fix missing import and modal test ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          notebook = Path("src/research_assistant/notebook_ui.py")
          source = notebook.read_text(encoding="utf-8")
          old = "        from fastapi import Query, WebSocket, WebSocketDisconnect\n"
          new = old + "        from fastapi.responses import Response\n"
          if "from fastapi.responses import Response" not in source:
              if old not in source:
                  raise SystemExit("notebook import anchor not found")
              source = source.replace(old, new, 1)
          notebook.write_text(source, encoding="utf-8")

          test = Path("tests/test_research_workspace.py")
          source = test.read_text(encoding="utf-8")
          old = '''            page.goto(f"http://127.0.0.1:{port}", wait_until="networkidle")
            page.locator("#ra-research-workspace-button").click()
'''
          new = '''            page.goto(f"http://127.0.0.1:{port}", wait_until="networkidle")
            page.get_by_role("button", name="Layout", exact=True).wait_for()
            page.locator("#ra-research-workspace-button").click()
'''
          if old not in source:
              raise SystemExit("browser ordering anchor not found")
          source = source.replace(old, new, 1)
          source = source.replace(
              '            page.get_by_role("button", name="Layout", exact=True).wait_for()\n',
              "",
              1,
          )
          # The replacement above removes the first occurrence; restore the intended pre-modal check.
          source = source.replace(old, new, 1) if old in source else source
          if source.count('page.get_by_role("button", name="Layout", exact=True).wait_for()') != 1:
              raise SystemExit("unexpected Layout assertion count")
          layout_index = source.index('page.get_by_role("button", name="Layout", exact=True).wait_for()')
          open_index = source.index('page.locator("#ra-research-workspace-button").click()')
          if layout_index > open_index:
              source = source.replace(
                  '            page.get_by_role("button", name="Layout", exact=True).wait_for()\n',
                  "",
                  1,
              )
              source = source.replace(
                  '            page.locator("#ra-research-workspace-button").click()\n',
                  '            page.get_by_role("button", name="Layout", exact=True).wait_for()\n'
                  '            page.locator("#ra-research-workspace-button").click()\n',
                  1,
              )
          test.write_text(source, encoding="utf-8")
          PY
      - name: Apply targeted Ruff fixes
        run: |
          ruff check --fix \
            src/research_assistant/explorer_ui.py \
            src/research_assistant/notebook_ui.py \
            src/research_assistant/pipeline_ui.py \
            src/research_assistant/research_ui.py \
            src/research_assistant/system_monitor_ui.py \
            src/research_assistant/terminal_ui.py \
            src/research_assistant/ui/server.py \
            src/research_assistant/workbench_ui.py \
            src/research_assistant/workspace_browser_ui.py \
            tests/test_research_workspace.py
          ruff check .
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/research_assistant/explorer_ui.py \
            src/research_assistant/notebook_ui.py \
            src/research_assistant/pipeline_ui.py \
            src/research_assistant/research_ui.py \
            src/research_assistant/system_monitor_ui.py \
            src/research_assistant/terminal_ui.py \
            src/research_assistant/ui/server.py \
            src/research_assistant/workbench_ui.py \
            src/research_assistant/workspace_browser_ui.py \
            tests/test_research_workspace.py
          git commit -m "Fix bundled route imports and browser flow"
          git push origin HEAD:feature/research-workspace-v2
