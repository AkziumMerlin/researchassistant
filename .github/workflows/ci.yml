name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrate-retired-ui-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/theia-desktop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/theia-desktop
      - name: Replace browser-era test blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pipeline = Path('tests/test_research_pipeline.py')
          source = pipeline.read_text(encoding='utf-8')
          marker = '\ndef test_cli_and_ui_surface_new_workflows() -> None:\n'
          if marker in source:
              source = source.split(marker, 1)[0] + '''

def test_cli_and_theia_surface_new_workflows() -> None:
    from research_assistant.cli_research import app

    names = {group.name for group in app.registered_groups}
    assert {"hpo", "dataset", "selection", "statistics", "research"}.issubset(names)

    source = (
        Path(__file__).parents[1]
        / "desktop/research-assistant-extension/src/browser/tabs/research-tab.ts"
    ).read_text(encoding="utf-8")
    for label in (
        "Adaptive HPO",
        "Datasets",
        "Selection",
        "Statistics",
        "Hypotheses",
        "Publication",
    ):
        assert label in source
'''
              pipeline.write_text(source, encoding='utf-8')

          workspace = Path('tests/test_research_workspace.py')
          source = workspace.read_text(encoding='utf-8')
          replacement = '''def test_research_workspace_api_and_theia_views_are_registered(tmp_path: Path) -> None:
    from research_assistant.desktop_server import create_desktop_app

    _write_run(
        tmp_path,
        study_id="study-a",
        trial_id="trial-a",
        run_id="run-a",
        seed=0,
        error=0.1,
    )
    client = TestClient(create_desktop_app(tmp_path, token="secret"))
    headers = {"Authorization": "Bearer secret"}

    runs_source = (
        Path(__file__).parents[1]
        / "desktop/research-assistant-extension/src/browser/tabs/runs-tab.ts"
    ).read_text(encoding="utf-8")
    assistant_source = (
        Path(__file__).parents[1]
        / "desktop/research-assistant-extension/src/browser/tabs/assistant-tab.ts"
    ).read_text(encoding="utf-8")
    assert "Cross-run aggregation" in runs_source
    assert "/api/workspace/runs/aggregate" in runs_source
    assert "/api/workspace/assistant/plan" in assistant_source

    capabilities = client.get("/api/workspace/capabilities", headers=headers)
    assert capabilities.status_code == 200
    assert any(
        row["capability_id"] == "notebook.context"
        for row in capabilities.json()["capabilities"]
    )
    runs = client.get("/api/workspace/runs", headers=headers)
    assert runs.status_code == 200
    assert runs.json()["runs"][0]["run_id"] == "run-a"
    aggregation = client.post(
        "/api/workspace/runs/aggregate",
        headers=headers,
        json={"run_ids": ["run-a"], "metric": "relative_l2"},
    )
    assert aggregation.status_code == 200, aggregation.text
    assistant = client.post(
        "/api/workspace/assistant/plan",
        headers=headers,
        json={"goal": "Inspect run results", "run_ids": ["run-a"]},
    )
    assert assistant.status_code == 200
    assert assistant.json()["actions"]


'''
          pattern = re.compile(
              r'def test_research_workspace_api_and_assets_are_registered\(tmp_path: Path\) -> None:\n.*?(?=def test_research_workspace_cli_is_available\(\) -> None:)',
              re.S,
          )
          source, count = pattern.subn(replacement, source)
          if count != 1:
              raise SystemExit(f'expected one workspace asset test, replaced {count}')
          browser_marker = '\n\n@pytest.mark.skipif(\n    os.environ.get("RA_BROWSER_E2E") != "1",'
          if browser_marker in source:
              source = source.split(browser_marker, 1)[0] + '\n'
          workspace.write_text(source, encoding='utf-8')
          PY
      - name: Commit migrated tests
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_research_pipeline.py tests/test_research_workspace.py
          git commit -m "Migrate remaining UI tests to Theia"
          git push origin HEAD:feature/theia-desktop

  ci-pending:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish connector-readable pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": "pending",
              "context": "ci/researchassistant",
              "description": "Python, Theia desktop, Torch and wheel checks are running",
              "target_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }))
          PY
          )"
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,desktop]'
      - run: ruff check .
      - run: pytest

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install native Electron build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbfile-dev
      - run: npm install --prefix desktop
      - run: npm run build --prefix desktop
      - name: Verify desktop architecture
        run: |
          test ! -d ui
          test -f desktop/research-assistant-extension/lib/browser/research-assistant-widget.js
          test -f desktop/research-assistant-extension/lib/browser/models-editor.js
          test -f desktop/research-assistant-extension/lib/browser/tabs/monitor-tab.js
          test -f desktop/research-assistant-extension/lib/browser/tabs/research-tab.js
          test -f desktop/research-assistant-extension/lib/node/research-assistant-backend-service.js
          test -f desktop/research-assistant-extension/lib/browser/style/research-assistant.css
          grep -q "overflow-y: scroll" desktop/research-assistant-extension/lib/browser/style/research-assistant.css
          grep -R "research-assistant/desktop-sidecar" desktop/research-assistant-extension/lib/node
          if grep -R "/api/extensions/" desktop/research-assistant-extension/lib; then
            echo "desktop bundle references the retired browser extension endpoint" >&2
            exit 1
          fi

  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/test_torch_integration.py

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build wheel
        run: python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          required = {
              "research_assistant/desktop.py",
              "research_assistant/desktop_server.py",
              "research_assistant/cli.py",
              "research_assistant/cli_desktop.py",
              "research_assistant/cli_workbench.py",
              "research_assistant/run_workspace.py",
              "research_assistant/notebook_context.py",
              "research_assistant/assistant_core.py",
              "research_assistant/durable_launches.py",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing required files: {missing}")
          PY
      - name: Install wheel and verify CLI/version
        run: |
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv /tmp/ra-wheel-smoke
          /tmp/ra-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ra-wheel-smoke/bin/ra --help
          /tmp/ra-wheel-smoke/bin/ra ui --help
          test "$(/tmp/ra-wheel-smoke/bin/ra version)" = "$expected_version"
          test "$(/tmp/ra-wheel-smoke/bin/python -c 'import research_assistant; print(research_assistant.__version__)')" = "$expected_version"

  ci-status:
    if: always()
    needs: [test, desktop, torch, wheel]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish connector-readable CI status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          TORCH_RESULT: ${{ needs.torch.result }}
          WHEEL_RESULT: ${{ needs.wheel.result }}
        run: |
          state=success
          for result in "$TEST_RESULT" "$DESKTOP_RESULT" "$TORCH_RESULT" "$WHEEL_RESULT"; do
            if [ "$result" != success ]; then
              state=failure
            fi
          done
          export STATE="$state"
          payload="$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "ci/researchassistant",
              "description": "Python, Theia desktop, Torch and wheel",
              "target_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }))
          PY
          )"
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
          test "$state" = success
