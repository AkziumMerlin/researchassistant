name: Apply frontend refactor

on:
  push:
    branches: [feature/research-workspace-v2]

permissions:
  contents: write

concurrency:
  group: apply-frontend-refactor
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/research-workspace-v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - name: Import verified refactor tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REFACTOR_TREE: d75cd487b64aacea8263f56c6d98998a8a862df3
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          def fetch_blob(sha: str) -> bytes:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return base64.b64decode(json.load(response)["content"])

          parts = [
              "514275791a3171f451475ecc9433e08fdbbe4c15",
              "9e4481af62aae7ad31f6488fadce10a354b20170",
              "d7b81d56ce81961c53416c519773358245c9c8ec",
              "9a7327d69649b63709c831f5b3304994f3959d2a",
              "bf0203349cf9b5c5908692c5f27c924faa1fbc72",
              "8dc4f85add0054220397df17843cb73f97fa104d",
          ]
          encoded = b"".join(fetch_blob(sha) for sha in parts)
          digest = hashlib.sha256(encoded).hexdigest()
          if len(encoded) != 36404 or digest != "32c5e105a379933af0a202b836b871d54e8f02f2a7953be2b269fb51dcc821b9":
              raise SystemExit(f"invalid transport: length={len(encoded)} sha256={digest}")
          Path("/tmp/refactor.pack").write_bytes(base64.b64decode(encoded))
          PY
          git index-pack --stdin --fix-thin < /tmp/refactor.pack
          git read-tree --reset -u "$REFACTOR_TREE"
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          def write_blob(sha: str, path: str) -> None:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  content = base64.b64decode(json.load(response)["content"])
              Path(path).write_bytes(content)

          write_blob("3d4fc9c508c9c476043e1a63a451d77e5b87e84a", "ui/frontend/vite.config.js")
          write_blob("52e4feb311f0518f2e16b3591ae0cd5637d3e541", "ui/frontend/src/extensions/layout-manager.js")
          PY
      - name: Build bundled frontend
        run: |
          npm ci --prefix ui/frontend
          npm run build --prefix ui/frontend
          python -m compileall -q src tests
          find ui/frontend/src/extensions -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check ui/frontend/src/main.js
          node --check ui/frontend/src/terminal-runtime.js
      - name: Commit and push refactor
        run: |
          git checkout HEAD -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor UI extensions into the frontend bundle"
          git push origin HEAD:feature/research-workspace-v2
