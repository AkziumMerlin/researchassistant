name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  refresh-feature-assets:
    if: github.event_name == 'push' && github.ref_name == 'feature/explorer-search-notebooks'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/explorer-search-notebooks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - name: Apply integration fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/research_assistant/notebooks.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import nbformat\nfrom jupyter_client import BlockingKernelClient",
              "import nbformat\nfrom jupyter_client import BlockingKernelClient\n"
              "from nbformat.validator import NotebookValidationError",
          )
          text = text.replace(
              "from research_assistant.ui.workspace import Workspace, WorkspaceConflict, WorkspaceError",
              "from research_assistant.ui.workspace import Workspace, WorkspaceConflict",
          )
          text = text.replace(
              "except (AttributeError, TypeError, ValueError, nbformat.ValidationError) as exc:",
              "except (AttributeError, TypeError, ValueError, NotebookValidationError) as exc:",
          )
          text = text.replace(
              '        return sorted((session.metadata() for session in sessions), key=lambda item: item["created_at"])',
              "        return sorted(\n"
              "            (session.metadata() for session in sessions),\n"
              '            key=lambda item: item["created_at"],\n'
              "        )",
          )
          text = text.replace(
              "for key, value in spec.env.items()",
              "for key, value in (spec.env or {}).items()",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/research_assistant/ui/static/notebook-extension.js")
          text = path.read_text(encoding="utf-8")
          text = text.replace('    runAll: false,\n', '    runAll: false,\n    autosaveTimer: null,\n')
          text = text.replace(
              '  let path = window.prompt("New notebook path", "notebooks/analysis.ipynb");',
              '  let path = window.prompt("New notebook path", "analysis.ipynb");',
          )
          text = text.replace(
              "    pending?.resolve();\n    return;",
              "    pending?.resolve();\n    scheduleNotebookAutosave(state);\n    return;",
          )
          marker = "\nfunction closeNotebook(state) {"
          addition = '''
function scheduleNotebookAutosave(state) {
  clearTimeout(state.autosaveTimer);
  state.autosaveTimer = setTimeout(() => {
    state.autosaveTimer = null;
    if (state.dirty) saveNotebook(state).catch(showNotebookError);
  }, 600);
}
'''
          if "function scheduleNotebookAutosave" not in text:
              text = text.replace(marker, addition + marker)
          path.write_text(text, encoding="utf-8")
          PY
      - run: npm ci --prefix ui/frontend
      - run: npm run build --prefix ui/frontend
      - run: node --check src/research_assistant/ui/static/explorer-plus.js
      - run: node --check src/research_assistant/ui/static/component-search.js
      - run: node --check src/research_assistant/ui/static/notebook-extension.js
      - name: Commit generated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research_assistant/notebooks.py src/research_assistant/ui/static
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[ui-assets] Fix notebook integration and rebuild frontend"
          git push origin HEAD:feature/explorer-search-notebooks

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,ui]'
      - run: ruff check .
      - run: pytest

  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/test_torch_integration.py

  frontend-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --prefix ui/frontend
      - run: npm run build --prefix ui/frontend
      - run: node --check src/research_assistant/ui/static/terminal-extension.js
      - run: node --check src/research_assistant/ui/static/system-monitor-extension.js
      - run: node --check src/research_assistant/ui/static/explorer-plus.js
      - run: node --check src/research_assistant/ui/static/component-search.js
      - run: node --check src/research_assistant/ui/static/notebook-extension.js
      - name: Verify generated UI assets are committed
        run: |
          git status --short --untracked-files=all -- src/research_assistant/ui/static
          test -z "$(git status --porcelain --untracked-files=all -- src/research_assistant/ui/static)"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          required = {
              "research_assistant/ui/static/index.html",
              "research_assistant/ui/static/jobs-extension.js",
              "research_assistant/ui/static/pipeline-extension.js",
              "research_assistant/ui/static/research-extension.js",
              "research_assistant/ui/static/architecture-extension.js",
              "research_assistant/ui/static/workbench-extension.js",
              "research_assistant/ui/static/terminal-extension.js",
              "research_assistant/ui/static/terminal-runtime.js",
              "research_assistant/ui/static/system-monitor-extension.js",
              "research_assistant/ui/static/explorer-plus.js",
              "research_assistant/ui/static/component-search.js",
              "research_assistant/ui/static/notebook-extension.js",
              "research_assistant/workbench_ui.py",
              "research_assistant/terminal.py",
              "research_assistant/tmux_terminal.py",
              "research_assistant/terminal_ui.py",
              "research_assistant/system_monitor.py",
              "research_assistant/system_monitor_ui.py",
              "research_assistant/workspace_browser_ui.py",
              "research_assistant/notebooks.py",
              "research_assistant/notebook_ui.py",
              "research_assistant/scientific_artifacts.py",
              "research_assistant/lifecycle.py",
              "research_assistant/analysis_sessions.py",
              "research_assistant/developer_tools.py",
              "research_assistant/workspaces.py",
              "research_assistant/analytics.py",
              "research_assistant/jobs.py",
              "research_assistant/integrations/parameterized_torch_graph.py",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing required files: {missing}")
          PY
      - name: Install wheel and smoke-test CLI
        run: |
          python -m venv /tmp/ra-wheel-smoke
          /tmp/ra-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ra-wheel-smoke/bin/ra --help
