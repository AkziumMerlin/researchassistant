name: Temporary Ruff Fix

on:
  push:
    branches: [agent/research-workbench]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/research-workbench' || github.ref_name == 'agent/research-workbench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/research-workbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,ui]'
      - run: ruff check . --fix
      - name: Commit exact Ruff fixes
        run: |
          git config user.name "researchassistant-ci"
          git config user.email "researchassistant-ci@users.noreply.github.com"
          git add src/research_assistant/scientific_artifacts.py src/research_assistant/lifecycle.py src/research_assistant/workbench_ui.py
          git diff --cached --check
          git commit -m "style: apply Ruff fixes"
          git push origin HEAD:agent/research-workbench
