name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publish-registration-fix:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/explorer-search-notebooks
      - name: Finalize UI registration after the CLI extension chain
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/research_assistant/cli_workbench.py")
          text = path.read_text(encoding="utf-8")
          old = '''if importlib.util.find_spec("fastapi") is not None:
              from research_assistant.workbench_ui import install as install_workbench_ui

              install_workbench_ui()
          '''
          new = '''if importlib.util.find_spec("fastapi") is not None:
              from research_assistant.notebook_ui import _register as register_notebook_ui
              from research_assistant.ui import server
              from research_assistant.workbench_ui import install as install_workbench_ui
              from research_assistant.workspace_browser_ui import (
                  _register as register_workspace_browser_ui,
              )

              install_workbench_ui()
              original_create_app = server.create_app

              def create_app(root, plugins=None, *, ssh_mode=None):
                  app = original_create_app(root, plugins, ssh_mode=ssh_mode)
                  paths = {getattr(route, "path", None) for route in app.routes}
                  if "/api/workspace/entries" not in paths:
                      register_workspace_browser_ui(app)
                  if not hasattr(app.state, "notebook_kernels"):
                      register_notebook_ui(app)
                  return app

              server.create_app = create_app
          '''
          if old not in text:
              if "register_workspace_browser_ui" in text:
                  raise SystemExit(0)
              raise SystemExit("could not locate cli_workbench UI installation block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit registration fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research_assistant/cli_workbench.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize Explorer and notebook UI registration"
          git push origin HEAD:feature/explorer-search-notebooks

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,ui]'
      - run: ruff check .
      - run: pytest

  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/test_torch_integration.py

  frontend-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --prefix ui/frontend
      - run: npm run build --prefix ui/frontend
      - run: node --check src/research_assistant/ui/static/terminal-extension.js
      - run: node --check src/research_assistant/ui/static/system-monitor-extension.js
      - run: node --check src/research_assistant/ui/static/monaco-global.js
      - run: node --check src/research_assistant/ui/static/explorer-plus.js
      - run: node --check src/research_assistant/ui/static/component-search.js
      - run: node --check src/research_assistant/ui/static/notebook-extension.js
      - name: Verify generated UI assets are committed
        run: |
          git status --short --untracked-files=all -- src/research_assistant/ui/static
          test -z "$(git status --porcelain --untracked-files=all -- src/research_assistant/ui/static)"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          required = {
              "research_assistant/ui/static/index.html",
              "research_assistant/ui/static/jobs-extension.js",
              "research_assistant/ui/static/pipeline-extension.js",
              "research_assistant/ui/static/research-extension.js",
              "research_assistant/ui/static/architecture-extension.js",
              "research_assistant/ui/static/workbench-extension.js",
              "research_assistant/ui/static/terminal-extension.js",
              "research_assistant/ui/static/terminal-runtime.js",
              "research_assistant/ui/static/system-monitor-extension.js",
              "research_assistant/ui/static/monaco-global.js",
              "research_assistant/ui/static/explorer-plus.js",
              "research_assistant/ui/static/component-search.js",
              "research_assistant/ui/static/notebook-extension.js",
              "research_assistant/workbench_ui.py",
              "research_assistant/terminal.py",
              "research_assistant/tmux_terminal.py",
              "research_assistant/terminal_ui.py",
              "research_assistant/system_monitor.py",
              "research_assistant/system_monitor_ui.py",
              "research_assistant/workspace_browser_ui.py",
              "research_assistant/notebooks.py",
              "research_assistant/notebook_ui.py",
              "research_assistant/scientific_artifacts.py",
              "research_assistant/lifecycle.py",
              "research_assistant/analysis_sessions.py",
              "research_assistant/developer_tools.py",
              "research_assistant/workspaces.py",
              "research_assistant/analytics.py",
              "research_assistant/jobs.py",
              "research_assistant/integrations/parameterized_torch_graph.py",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing required files: {missing}")
          PY
      - name: Install wheel and smoke-test CLI
        run: |
          python -m venv /tmp/ra-wheel-smoke
          /tmp/ra-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ra-wheel-smoke/bin/ra --help
