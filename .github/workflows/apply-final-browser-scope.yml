name: Apply final browser scope

on:
  push:
    branches: [feature/research-workspace-v2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/research-workspace-v2
      - name: Scope all Research workspace browser locators and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_workspace_v2.py")
          source = path.read_text(encoding="utf-8")
          old = '''            page.locator("#ra-research-workspace-button").click()
            page.locator("#ra-research-workspace[open]").wait_for()
            page.get_by_role("heading", name="Research workspace").wait_for()
            page.locator(
                "#ra-research-workspace .rwRunIdentity strong",
                has_text="study-a / run-a",
            ).first.wait_for()
            page.get_by_role("button", name="Layout", exact=True).wait_for()
            page.get_by_role("button", name="Artifacts", exact=True).click()
            page.get_by_role("button", name="Assistant", exact=True).click()
            page.get_by_role("heading", name="Typed research planner").wait_for()
'''
          new = '''            page.locator("#ra-research-workspace-button").click()
            workspace_dialog = page.locator("#ra-research-workspace[open]")
            workspace_dialog.wait_for()
            workspace_dialog.get_by_role(
                "heading",
                name="Research workspace",
            ).wait_for()
            workspace_dialog.locator(
                ".rwRunIdentity strong",
                has_text="study-a / run-a",
            ).first.wait_for()
            page.get_by_role("button", name="Layout", exact=True).wait_for()
            workspace_dialog.get_by_role(
                "button",
                name="Artifacts",
                exact=True,
            ).click()
            workspace_dialog.get_by_role(
                "button",
                name="Assistant",
                exact=True,
            ).click()
            workspace_dialog.get_by_role(
                "heading",
                name="Typed research planner",
            ).wait_for()
'''
          if old not in source:
              raise SystemExit("final browser selector block was not found")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/apply-final-browser-scope.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_workspace_v2.py .github/workflows/apply-final-browser-scope.yml
          git commit -m "Scope Research workspace E2E locators"
          git push origin HEAD:feature/research-workspace-v2
