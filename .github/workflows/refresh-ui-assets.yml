name: Refresh UI assets

on:
  push:
    branches:
      - feature/explorer-search-notebooks

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[ui-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/explorer-search-notebooks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - name: Apply integration fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/research_assistant/notebooks.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import nbformat\nfrom jupyter_client import BlockingKernelClient",
              "import nbformat\nfrom jupyter_client import BlockingKernelClient\n"
              "from nbformat.validator import NotebookValidationError",
          )
          text = text.replace(
              "from research_assistant.ui.workspace import Workspace, WorkspaceConflict, WorkspaceError",
              "from research_assistant.ui.workspace import Workspace, WorkspaceConflict",
          )
          text = text.replace(
              "except (AttributeError, TypeError, ValueError, nbformat.ValidationError) as exc:",
              "except (AttributeError, TypeError, ValueError, NotebookValidationError) as exc:",
          )
          text = text.replace(
              '        return sorted((session.metadata() for session in sessions), key=lambda item: item["created_at"])',
              "        return sorted(\n"
              "            (session.metadata() for session in sessions),\n"
              '            key=lambda item: item["created_at"],\n'
              "        )",
          )
          text = text.replace("for key, value in spec.env.items()", "for key, value in (spec.env or {}).items()")
          path.write_text(text, encoding="utf-8")

          path = Path("src/research_assistant/ui/static/notebook-extension.js")
          text = path.read_text(encoding="utf-8")
          text = text.replace('    runAll: false,\n', '    runAll: false,\n    autosaveTimer: null,\n')
          text = text.replace(
              '  let path = window.prompt("New notebook path", "notebooks/analysis.ipynb");',
              '  let path = window.prompt("New notebook path", "analysis.ipynb");',
          )
          text = text.replace(
              "    pending?.resolve();\n    return;",
              "    pending?.resolve();\n    scheduleNotebookAutosave(state);\n    return;",
          )
          marker = "\nfunction closeNotebook(state) {"
          addition = '''
function scheduleNotebookAutosave(state) {
  clearTimeout(state.autosaveTimer);
  state.autosaveTimer = setTimeout(() => {
    state.autosaveTimer = null;
    if (state.dirty) saveNotebook(state).catch(showNotebookError);
  }, 600);
}
'''
          if "function scheduleNotebookAutosave" not in text:
              text = text.replace(marker, addition + marker)
          path.write_text(text, encoding="utf-8")
          PY
      - run: npm ci --prefix ui/frontend
      - run: npm run build --prefix ui/frontend
      - run: node --check src/research_assistant/ui/static/explorer-plus.js
      - run: node --check src/research_assistant/ui/static/component-search.js
      - run: node --check src/research_assistant/ui/static/notebook-extension.js
      - name: Commit generated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research_assistant/notebooks.py src/research_assistant/ui/static
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[ui-assets] Fix notebook integration and rebuild frontend"
          git push origin HEAD:feature/explorer-search-notebooks
