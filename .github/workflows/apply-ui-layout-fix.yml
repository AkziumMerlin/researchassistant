name: Apply UI layout fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/ui-toolbar-editor-layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-toolbar-editor-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "ui/frontend/src/styles.css",
              ".workbench {\n  display: grid;\n  grid-template-columns: 270px minmax(360px, 1fr) 310px;\n  min-height: 0;\n}\n",
              ".workbench {\n  display: grid;\n  grid-template-columns: 270px minmax(0, 1fr);\n  min-height: 0;\n}\n\n.workbench.ra-registry-open {\n  grid-template-columns: 270px minmax(0, 1fr) 310px;\n}\n",
          )
          replace_once(
              "ui/frontend/src/styles.css",
              ".registry-panel {\n  border-left: 1px solid var(--border);\n}\n",
              ".registry-panel {\n  display: none;\n  border-left: 1px solid var(--border);\n}\n\n.workbench.ra-registry-open .registry-panel {\n  display: block;\n}\n",
          )
          replace_once(
              "ui/frontend/src/styles.css",
              ".editor-column {\n  display: grid;\n  grid-template-rows: 36px minmax(0, 1fr) 150px;\n  min-width: 0;\n  min-height: 0;\n  background: #101514;\n}\n",
              ".editor-column {\n  display: grid;\n  grid-template-rows: 36px minmax(0, 1fr) 150px;\n  min-width: 0;\n  min-height: 0;\n  overflow: hidden;\n  background: #101514;\n}\n\n.tabs {\n  grid-row: 1;\n}\n\n.empty-state,\n.editor {\n  grid-row: 2;\n  grid-column: 1;\n}\n\n.output-panel {\n  grid-row: 3;\n}\n",
          )
          replace_once(
              "ui/frontend/src/styles.css",
              ".editor {\n  min-width: 0;\n  min-height: 0;\n}\n",
              ".editor {\n  width: 100%;\n  height: 100%;\n  min-width: 0;\n  min-height: 0;\n}\n\n.editor > .monaco-editor {\n  width: 100% !important;\n  height: 100% !important;\n}\n",
          )

          replace_once(
              "ui/frontend/index.html",
              '<div id="editor" class="editor" aria-label="File editor"></div>',
              '<div id="editor" class="editor" aria-label="File editor" hidden></div>',
          )
          replace_once(
              "ui/frontend/index.html",
              '<aside class="sidebar registry-panel">',
              '<aside id="registry-panel" class="sidebar registry-panel" hidden>',
          )
          replace_once(
              "src/research_assistant/explorer_ui.py",
              "_PATCH_VERSION = 9",
              "_PATCH_VERSION = 10",
          )

          replace_once(
              "ui/frontend/vite.config.js",
              'import { readFile, writeFile } from "node:fs/promises";\nimport { resolve } from "node:path";',
              'import { mkdir, readFile, writeFile } from "node:fs/promises";\nimport { dirname, resolve } from "node:path";',
          )
          replace_once(
              "ui/frontend/vite.config.js",
              '  "workbench-extension.js",\n];',
              '  "workbench-extension.js",\n  "architecture-extension.js",\n  ...Array.from({ length: 8 }, (_, index) =>\n    `architecture-v2/part-${String(index).padStart(2, "0")}.txt`,\n  ),\n];',
          )
          replace_once(
              "ui/frontend/vite.config.js",
              '      for (const [name, content] of contents) {\n        await writeFile(resolve(staticRoot, name), content);\n      }',
              '      for (const [name, content] of contents) {\n        const destination = resolve(staticRoot, name);\n        await mkdir(dirname(destination), { recursive: true });\n        await writeFile(destination, content);\n      }',
          )

          part = "src/research_assistant/ui/static/architecture-v2/part-07.txt"
          replace_once(
              part,
              "    .topbar{\n      grid-template-columns:270px minmax(180px,1fr) auto;\n    }\n    .topbar-actions{\n      min-width:0;\n      gap:7px;\n    }\n",
              "    .topbar{\n      position:relative;\n      z-index:40;\n      grid-template-columns:270px minmax(180px,1fr) auto;\n    }\n    .topbar-actions{\n      position:relative;\n      z-index:41;\n      min-width:0;\n      gap:7px;\n      overflow:visible;\n    }\n    .workbench{grid-template-columns:270px minmax(0,1fr) !important}\n    .editor-column{grid-column:2;width:100%;min-width:0;overflow:hidden}\n    .tabs{grid-row:1}\n    .empty-state,.editor{grid-row:2;grid-column:1}\n    .output-panel{grid-row:3}\n    .editor{display:block;width:100%;height:100%;min-width:0;min-height:0}\n    .editor[hidden]{display:none}\n    .editor>.monaco-editor{width:100% !important;height:100% !important}\n    .registry-panel{display:none !important;grid-column:3}\n    .workbench.ra-registry-open{grid-template-columns:270px minmax(0,1fr) 310px !important}\n    .workbench.ra-registry-open .registry-panel{display:block !important}\n    .ra-registry-controls{display:flex;align-items:center;gap:6px}\n    @media(max-width:1180px){\n      .workbench.ra-registry-open{grid-template-columns:240px minmax(0,1fr) !important}\n      .workbench.ra-registry-open .registry-panel{position:fixed;z-index:60;top:54px;right:0;bottom:24px;display:block !important;width:310px;box-shadow:-18px 0 50px #0009}\n    }\n",
          )

          registry_helpers = '''  const REGISTRY_STATE_KEY = "research-assistant.registry-open.v1";

  function registryIsOpen() {
    return document.querySelector(".workbench")?.classList.contains("ra-registry-open") || false;
  }

  function updateRegistryToggle() {
    const toggle = document.querySelector("#ra-registry-toggle");
    if (!toggle) return;
    const open = registryIsOpen();
    toggle.textContent = open ? "Hide Registry" : "Registry";
    toggle.setAttribute("aria-pressed", String(open));
  }

  function setRegistryOpen(open, persist = true) {
    const workbench = document.querySelector(".workbench");
    const panel = document.querySelector(".registry-panel");
    if (!workbench || !panel) return;
    const changed = registryIsOpen() !== open || panel.hidden === open;
    workbench.classList.toggle("ra-registry-open", open);
    panel.hidden = !open;
    panel.setAttribute("aria-hidden", String(!open));
    if (persist) {
      try { localStorage.setItem(REGISTRY_STATE_KEY, open ? "1" : "0"); } catch {}
    }
    updateRegistryToggle();
    if (changed) requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
  }

  function prepareRegistryPanel() {
    const panel = document.querySelector(".registry-panel");
    const heading = panel?.querySelector(".panel-heading");
    if (!panel || !heading) return;
    let controls = heading.querySelector(".ra-registry-controls");
    if (!controls) {
      controls = document.createElement("span");
      controls.className = "ra-registry-controls";
      const count = heading.querySelector("#component-count");
      if (count) controls.append(count);
      const close = document.createElement("button");
      close.type = "button";
      close.className = "icon-button";
      close.setAttribute("aria-label", "Hide Registry");
      close.textContent = "×";
      close.addEventListener("click", () => setRegistryOpen(false));
      controls.append(close);
      heading.append(controls);
    }
    let open = false;
    try { open = localStorage.getItem(REGISTRY_STATE_KEY) === "1"; } catch {}
    setRegistryOpen(open, false);
  }

'''
          replace_once(part, "  function normalizeTopbar() {\n", registry_helpers + "  function normalizeTopbar() {\n")
          replace_once(
              part,
              '    const popover = more.querySelector(".ra-more-popover");\n\n    const primaryLabels',
              '    const popover = more.querySelector(".ra-more-popover");\n    if (popover.dataset.raCloseBound !== "1") {\n      popover.dataset.raCloseBound = "1";\n      popover.addEventListener("click", (event) => {\n        if (event.target.closest("button")) more.removeAttribute("open");\n      });\n    }\n    let registryToggle = actions.querySelector("#ra-registry-toggle");\n    if (!registryToggle) {\n      registryToggle = document.createElement("button");\n      registryToggle.id = "ra-registry-toggle";\n      registryToggle.type = "button";\n      registryToggle.className = "button ghost";\n      registryToggle.textContent = "Registry";\n      registryToggle.addEventListener("click", () => setRegistryOpen(!registryIsOpen()));\n      actions.append(registryToggle);\n    }\n    updateRegistryToggle();\n\n    const primaryLabels',
          )
          replace_once(
              part,
              '    const moreLabels = ["Charts", "Checkpoints", "Project", "New file"];',
              '    const moreLabels = ["Registry", "Charts", "Checkpoints", "Project", "New file"];',
          )
          replace_once(
              part,
              '  function apply() {\n    document.querySelectorAll("dialog.raX,dialog.raPipe,dialog.raResearch,dialog.ra-models-v2")\n      .forEach(decorateDialog);\n    normalizeTopbar();\n  }\n\n  let pending = false;\n  const observer = new MutationObserver(() => {\n    if (pending) return;\n    pending = true;\n    requestAnimationFrame(() => {\n      pending = false;\n      apply();\n    });\n  });\n  observer.observe(document.documentElement, { childList: true, subtree: true });\n  apply();',
              '  function apply() {\n    observer.disconnect();\n    document.querySelectorAll("dialog.raX,dialog.raPipe,dialog.raResearch,dialog.ra-models-v2")\n      .forEach(decorateDialog);\n    prepareRegistryPanel();\n    normalizeTopbar();\n    observer.observe(document.documentElement, { childList: true, subtree: true });\n  }\n\n  let pending = false;\n  const observer = new MutationObserver((mutations) => {\n    const actions = document.querySelector(".topbar-actions");\n    const relevant = mutations.some((mutation) => {\n      if (mutation.target === actions) return true;\n      return [...mutation.addedNodes].some(\n        (node) => node.nodeType === Node.ELEMENT_NODE\n          && (node.matches?.("dialog") || node.querySelector?.("dialog")),\n      );\n    });\n    if (!relevant || pending) return;\n    pending = true;\n    requestAnimationFrame(() => {\n      pending = false;\n      apply();\n    });\n  });\n  apply();',
          )

          Path("tests/test_ui_layout_regression.py").write_text(
              '''from pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef test_editor_and_registry_layout_are_explicit() -> None:\n    html = (ROOT / "ui/frontend/index.html").read_text(encoding="utf-8")\n    css = (ROOT / "ui/frontend/src/styles.css").read_text(encoding="utf-8")\n    assert 'id="editor" class="editor" aria-label="File editor" hidden' in html\n    assert 'id="registry-panel" class="sidebar registry-panel" hidden' in html\n    assert ".empty-state,\\n.editor {\\n  grid-row: 2;" in css\n    assert ".workbench.ra-registry-open" in css\n    assert ".registry-panel {\\n  display: none;" in css\n\n\ndef test_toolbar_observer_does_not_rewrite_itself_forever() -> None:\n    source = (ROOT / "src/research_assistant/ui/static/architecture-v2/part-07.txt").read_text(encoding="utf-8")\n    assert "observer.disconnect();" in source\n    assert "mutation.target === actions" in source\n    assert 'registryToggle.id = "ra-registry-toggle"' in source\n    assert 'const moreLabels = ["Registry",' in source\n\n\ndef test_vite_preserves_architecture_runtime_files() -> None:\n    source = (ROOT / "ui/frontend/vite.config.js").read_text(encoding="utf-8")\n    assert '"architecture-extension.js"' in source\n    assert "`architecture-v2/part-" in source\n    assert "mkdir(dirname(destination)" in source\n''',
              encoding="utf-8",
          )
          PY
      - name: Build frontend
        run: |
          npm ci --prefix ui/frontend
          npm run build --prefix ui/frontend
      - name: Validate code
        run: |
          cat src/research_assistant/ui/static/architecture-v2/part-*.txt > /tmp/architecture-v2.js
          node --check /tmp/architecture-v2.js
          python -m pip install -e '.[dev,ui]'
          ruff check .
          pytest tests/test_ui_layout_regression.py
          git diff --check
      - name: Commit fix
        run: |
          rm .github/workflows/apply-ui-layout-fix.yml
          git config user.name "researchassistant-ci"
          git config user.email "researchassistant-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore UI toolbar and editor layout"
          git push origin HEAD:fix/ui-toolbar-editor-layout
