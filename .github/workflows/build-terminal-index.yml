name: Build terminal index

on:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-terminal
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - name: Register terminal extension in source index
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ui/frontend/index.html")
          content = path.read_text(encoding="utf-8")
          source = '<script type="module" src="/api/extensions/terminal.js"></script>'
          if source not in content:
              needle = '    <script type="module" src="/src/main.js"></script>'
              replacement = f'    {source}\n{needle}'
              if needle not in content:
                  raise SystemExit("main frontend script was not found")
              content = content.replace(needle, replacement)
              path.write_text(content, encoding="utf-8")
          PY
      - run: npm ci --prefix ui/frontend
      - run: npm run build --prefix ui/frontend
      - name: Verify generated index
        run: grep -q '/api/extensions/terminal.js' src/research_assistant/ui/static/index.html
      - name: Commit source and generated index
        run: |
          rm .github/workflows/build-terminal-index.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui/frontend/index.html src/research_assistant/ui/static .github/workflows/build-terminal-index.yml
          git commit -m "Load terminal extension from the frontend index"
          git push origin HEAD:feature/ui-terminal
