name: UI parity snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.ref == 'feature/theia-ui-parity-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/theia-ui-parity-update
          fetch-depth: 0
      - name: Capture branch tree
        run: git rev-parse 'HEAD^{tree}' > /tmp/tree-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ui-parity-branch-tree
          path: /tmp/tree-sha.txt
          retention-days: 1
          if-no-files-found: error
