name: Apply Theia UI parity update

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/theia-ui-parity-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/theia-ui-parity-update
          fetch-depth: 0
      - name: Detect pending transport
        id: transport
        run: |
          if [ -f .ra-transport-parity/part-00a ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.transport.outputs.present == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.transport.outputs.present == 'true'
        with:
          node-version: '24'
      - name: Install validation prerequisites
        if: steps.transport.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxkbfile-dev tmux
      - name: Reconstruct verified source archive
        if: steps.transport.outputs.present == 'true'
        run: |
          cat > /tmp/parity-parts.sha256 <<'EOF'
          6ba4df190dc031a2eff5e0abe35bc504dfaa864d218e894c8f8a023e05533bd9  .ra-transport-parity/part-00a
          62ca6c6dfb0dbe26bcb95c61e67469571602efa04f894dc8375fd5658b1f1381  .ra-transport-parity/part-00b
          1d7e75304819c6ae1b3c1f3f0300173651d5b161e5bc4f6f1c4aeb5c62c527e6  .ra-transport-parity/part-01
          e41708fb231b426e0d0011038997c53d30191b51d584362f57cc2463109938ab  .ra-transport-parity/part-02
          c8e38c11cd04d304d7a619facbb17295102ebcd1a4a126c77f4d7731bfc897b1  .ra-transport-parity/part-03
          312018ecc2b90cab80924dc73634d9b038179e9576dbe0436f2a4f0999d2f4d0  .ra-transport-parity/part-04
          2f5d99c940f38fbd8b568818202afa522a692c52f7290c1f0415f93196a04a66  .ra-transport-parity/part-05
          2be5098e6d748d05a08ae5128766cf81ebd1a658f95b0cef7f1bd28ccaad6e58  .ra-transport-parity/part-06
          359e96f40c6690ec29b65ce80162033fb6e59b5baba087f4dfae78fb3b167bd9  .ra-transport-parity/part-07
          1ed3382bb62470c06146ef0f81b11d08bb785414fe77f9b08482e57086c3e17d  .ra-transport-parity/part-08
          579f141f1a08713b98290b5af4319eee8039e2d738ee4ccfea1a73d5b42da38f  .ra-transport-parity/part-09
          EOF
          sha256sum --check /tmp/parity-parts.sha256
          cat \
            .ra-transport-parity/part-00a \
            .ra-transport-parity/part-00b \
            .ra-transport-parity/part-01 \
            .ra-transport-parity/part-02 \
            .ra-transport-parity/part-03 \
            .ra-transport-parity/part-04 \
            .ra-transport-parity/part-05 \
            .ra-transport-parity/part-06 \
            .ra-transport-parity/part-07 \
            .ra-transport-parity/part-08 \
            .ra-transport-parity/part-09 \
            > /tmp/parity-update.b64
          echo '07750751a240b386e15db1b30bc0a7f191d24300b022f489038ab50d5fcd9ce1  /tmp/parity-update.b64' | sha256sum --check
          base64 --decode /tmp/parity-update.b64 > /tmp/parity-update.tar.gz
          echo 'bcdb2d7b1b496b88e06c8a7460b7ef54c2f4b52e23acd46bbbf35dc00fffff10  /tmp/parity-update.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/parity-update.tar.gz
          rm -rf .ra-transport-parity
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/ui-parity-snapshot.yml
      - name: Validate Python implementation
        if: steps.transport.outputs.present == 'true'
        run: |
          python -m pip install -e '.[dev,desktop]'
          ruff check --fix src/research_assistant/cli_explorer.py src/research_assistant/updater.py
          ruff check .
          pytest tests/test_update.py tests/test_theia_desktop_frontend.py tests/test_desktop.py
      - name: Validate Theia implementation
        if: steps.transport.outputs.present == 'true'
        run: |
          npm install --prefix desktop
          npm run build --prefix desktop
      - name: Remove generated validation outputs
        if: steps.transport.outputs.present == 'true'
        run: |
          rm -rf desktop/research-assistant-extension/lib
          rm -f desktop/research-assistant-extension/tsconfig.tsbuildinfo
          rm -rf desktop/application/src-gen
          rm -f desktop/application/esbuild.mjs
          rm -f desktop/application/gen-esbuild.browser.mjs
          rm -f desktop/application/gen-esbuild.electron.mjs
          rm -f desktop/application/gen-esbuild.node.mjs
          rm -f desktop/package-lock.json
          rm -rf .pytest_cache
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit functional sources
        if: steps.transport.outputs.present == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Theia UI parity and add update commands'
          git push origin HEAD:feature/theia-ui-parity-update
