name: Build terminal asset artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix ui/frontend
      - run: npm run build --prefix ui/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-assets
          if-no-files-found: error
          path: |
            ui/frontend/package-lock.json
            src/research_assistant/ui/static
