name: Build terminal assets

on:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-terminal
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - run: npm install --prefix ui/frontend
      - run: npm run build --prefix ui/frontend
      - name: Commit generated terminal assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui/frontend/package-lock.json src/research_assistant/ui/static
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build terminal frontend assets"
          git push origin HEAD:feature/ui-terminal
