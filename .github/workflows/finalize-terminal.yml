name: Finalize terminal runtime

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-terminal
      - name: Preserve environments and allow terminal WebSockets
        run: |
          python - <<'PY'
          from pathlib import Path

          terminal = Path("src/research_assistant/terminal.py")
          content = terminal.read_text(encoding="utf-8")
          login_block = '''    if len(argv) == 1 and Path(argv[0]).name in {"bash", "zsh", "sh", "dash", "ksh", "fish"}:
              argv.append("-l")
          '''
          if login_block not in content:
              raise SystemExit("automatic login-shell block was not found")
          terminal.write_text(content.replace(login_block, ""), encoding="utf-8")

          server = Path("src/research_assistant/ui/server.py")
          content = server.read_text(encoding="utf-8")
          old = '"worker-src \'self\' blob:; img-src \'self\' data:; connect-src \'self\'; "'
          new = '"worker-src \'self\' blob:; img-src \'self\' data:; connect-src \'self\' ws: wss:; "'
          if old not in content:
              raise SystemExit("CSP connect-src declaration was not found")
          server.write_text(content.replace(old, new), encoding="utf-8")
          PY
      - name: Commit final runtime changes
        run: |
          rm .github/workflows/finalize-terminal.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research_assistant/terminal.py src/research_assistant/ui/server.py .github/workflows/finalize-terminal.yml
          git commit -m "Finalize terminal environment and WebSocket behavior"
          git push origin HEAD:feature/ui-terminal
