name: Research workbench bootstrap

on:
  push:
    branches: [agent/research-workbench]
    paths:
      - ".ra-bootstrap-v2/research-workbench/**"
      - ".github/workflows/research-workbench-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: research-workbench-bootstrap
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/research-workbench
          fetch-depth: 0
      - name: Check complete payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/research-workbench"
          count=$(find .ra-bootstrap-v2/research-workbench -maxdepth 1 -type f -name 'part-*' 2>/dev/null | wc -l)
          if [ "$count" -ne 6 ]; then
            echo "Payload is incomplete: $count/6 parts"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .ra-bootstrap-v2/research-workbench/part-* > /tmp/research-workbench.b64
          base64 --decode /tmp/research-workbench.b64 > /tmp/research-workbench.tar.gz
          echo "6df8fe7feeb86d312ccabe2f0eb7f882a2ceb9aa9fad33d3a5fd351cf41d7a3b  /tmp/research-workbench.tar.gz" | sha256sum --check
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Apply payload
        if: steps.payload.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/research-workbench-payload
          mkdir -p /tmp/research-workbench-payload
          tar -xzf /tmp/research-workbench.tar.gz -C /tmp/research-workbench-payload
          python /tmp/research-workbench-payload/apply.py "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        if: steps.payload.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.payload.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - name: Validate Python
        if: steps.payload.outputs.ready == 'true'
        run: |
          python -m pip install -e '.[dev,ui]'
          ruff check .
          pytest
          python -m compileall -q src tests
      - name: Validate frontend
        if: steps.payload.outputs.ready == 'true'
        run: |
          npm ci --prefix ui/frontend
          npm run build --prefix ui/frontend
          node --check src/research_assistant/ui/static/workbench-extension.js
      - name: Commit functional tree
        if: steps.payload.outputs.ready == 'true'
        run: |
          set -euo pipefail
          test ! -e .ra-bootstrap
          test ! -e .ra-bootstrap-v2
          test ! -e .github/workflows/research-workbench-bootstrap.yml
          git config user.name "researchassistant-bootstrap"
          git config user.email "researchassistant-bootstrap@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add integrated research workbench"
          git push origin HEAD:agent/research-workbench
