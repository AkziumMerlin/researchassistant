name: Finalize system monitor

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/system-monitor
      - name: Make process detail independent of global process count
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/research_assistant/system_monitor.py")
          content = path.read_text(encoding="utf-8")
          old = '        snapshot = self.snapshot(process_limit=2000, process_sort="pid")\n'
          new = (
              '        snapshot = self.snapshot(\n'
              '            process_limit=100,\n'
              '            process_sort="pid",\n'
              '            search=str(pid),\n'
              '        )\n'
          )
          if old not in content:
              raise SystemExit("process-context snapshot call was not found")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit final change
        run: |
          rm .github/workflows/finalize-system-monitor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research_assistant/system_monitor.py .github/workflows/finalize-system-monitor.yml
          git commit -m "Make system monitor process lookup scalable"
          git push origin HEAD:feature/system-monitor
