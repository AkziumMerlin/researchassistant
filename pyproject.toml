[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "research-assistant"
version = "0.1.0"
description = "A local-first, plugin-driven experiment orchestrator."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AkziumMerlin" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9",
]
torch = [
  "torch>=2.2",
]
ui = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]
reports = [
  "matplotlib>=3.8,<4",
]
tensorboard = [
  "torch>=2.2",
  "tensorboard>=2.16,<3",
]

[project.scripts]
ra = "research_assistant.cli_research:app"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/research_assistant/publication.py" = ["E731"]
