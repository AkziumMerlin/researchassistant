[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "research-assistant"
version = "0.3.0"
description = "A local-first, plugin-driven experiment orchestrator."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AkziumMerlin" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9",
]
torch = [
  "torch>=2.2",
]
ui = [
  "fastapi>=0.116,<1",
  "ipykernel>=6.29,<8",
  "jupyter-client>=8.6,<9",
  "nbformat>=5.10,<6",
  "uvicorn[standard]>=0.35,<1",
]
e2e = [
  "playwright>=1.50,<2",
]
reports = [
  "matplotlib>=3.8,<4",
]
scientific = [
  "numpy>=1.26,<3",
]
tensorboard = [
  "torch>=2.2",
  "tensorboard>=2.16,<3",
]

[project.scripts]
ra = "research_assistant.cli_workbench:app"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/research_assistant/publication.py" = ["E731"]
"src/research_assistant/dataset_registry.py" = ["E501", "F401"]
"src/research_assistant/hpo.py" = ["E501"]
"src/research_assistant/publication_plus.py" = ["E501", "I001"]
"src/research_assistant/selection.py" = ["E501"]
"src/research_assistant/statistics_suite.py" = ["E501"]
"tests/test_research_pipeline.py" = ["E501"]
"src/research_assistant/analysis_sessions.py" = ["E501"]
"src/research_assistant/cli_workbench.py" = ["E501"]
"src/research_assistant/developer_tools.py" = ["E501"]
"src/research_assistant/lifecycle.py" = ["E501"]
"src/research_assistant/scientific_artifacts.py" = ["E501"]
"src/research_assistant/workbench_ui.py" = ["E501"]
"src/research_assistant/workspaces.py" = ["E501"]
"tests/test_research_workbench.py" = ["E501"]
"src/research_assistant/assistant_core.py" = ["E501"]
"src/research_assistant/durable_launches.py" = ["E501"]
"src/research_assistant/notebook_context.py" = ["E501"]
"src/research_assistant/plugin_sdk.py" = ["E501"]
"src/research_assistant/research_workspace_ui.py" = ["E501", "B008"]
"src/research_assistant/run_workspace.py" = ["E501"]
"tests/test_research_workspace.py" = ["E501"]
